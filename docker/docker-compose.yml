version: '3'
services:
  elasticsearch:
    # Must match production. The 7.x client refuses to talk to a 6.x server
    # because of the product check added in 7.14.
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:3000,http://127.0.0.1:1358
      - http.cors.allow-headers=X-Requested-With,X-Auth-Token,Content-Type,Content-Length,Authorization
      - http.cors.allow-credentials=true

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.29
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on: ['elasticsearch']

  database:
    image: mysql:8.0
    environment:
      - "MYSQL_DATABASE=surfbook"
      - "MYSQL_USER=glazewave"
      - "MYSQL_PASSWORD=glazewave"
      - "MYSQL_ROOT_PASSWORD=secret"
    ports:
      - "33062:3306"
